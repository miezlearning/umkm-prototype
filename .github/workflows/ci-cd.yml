name: Aristotle POS CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Izin untuk GitHub Pages deployment & GitHub Release creation
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Deploy Web App ke GitHub Pages (OTA Cloud Updates)
  # ==========================================
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Unggah direktori root (index.html, css, js, sw.js, manifest.json)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # JOB 2: Build Native Android APK (Aristotle-POS.apk)
  # ==========================================
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Sync Latest Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/
          cp -r index.html manifest.json icon.svg css js android/app/src/main/assets/

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Aristotle-POS.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aristotle-POS-APK
          path: Aristotle-POS.apk
          retention-days: 30

      - name: Publish GitHub Release with APK & Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "Aristotle POS v1.1.0 - Production Release"
          body_path: RELEASE_NOTES.md
          files: Aristotle-POS.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
